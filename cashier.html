<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الصالة والمطبخ المركزي</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0c0d12; color: #e2e8f0; }
        .section-bar { background: #181922; padding: 12px 18px; border-radius: 8px; font-weight: 700; border-right: 4px solid #c5a880; }
        .kds-bill-card { background: #181922; border-radius: 14px; border: 1px solid rgba(255,255,255,0.02); }
        .waiter-call-card { background: #2d2314; border: 1px solid #c5a880; border-radius: 10px; padding: 15px; margin-bottom: 12px; }
        .notes-badge-box { background: rgba(220, 53, 69, 0.12); border: 1px dashed #dc3545; color: #f87171; border-radius: 8px; padding: 10px; font-size: 0.85rem; font-weight: bold; }
    </style>
</head>
<body>

<div class="navbar navbar-dark bg-dark px-4 py-3 border-bottom border-secondary">
    <span class="navbar-brand fw-bold text-warning"><i class="bi bi-cpu-fill me-2"></i> لوحة تحكم المطبخ والصالة الفاخرة</span>
</div>

<div class="container-fluid px-4 mt-4">
    <div class="row g-4">
        
        <!-- لوحة نداء النادل الفورية -->
        <div class="col-12 col-md-4">
            <h6 class="section-bar text-warning mb-3"><i class="bi bi-bell-fill"></i> لوحة نداء الويتر الفورية</h6>
            <div id="dom-waiter-calls-list"></div>
        </div>

        <!-- طلبات الطهي الحية بالمطبخ -->
        <div class="col-12 col-md-8">
            <h6 class="section-bar text-success mb-3"><i class="bi bi-fire"></i> طلبات الطهي الحية بالمطبخ</h6>
            <div id="dom-kitchen-orders-list" class="row g-3"></div>
        </div>

    </div>
</div>

<!-- تضمين مكتبات Firebase الأساسية لإدارة قواعد البيانات الحية -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
    // تكوين الاتصال بقاعدة بيانات النظام السحابية لـ مطعم دجلة
    const firebaseConfig = {
        apiKey: "AIzaSyC6fFl4gN2N-W7oK3v70g_v3P932fM6bNY",
        authDomain: "almenu-system.firebaseapp.com",
        databaseURL: "https://almenu-system-default-rtdb.firebaseio.com",
        projectId: "almenu-system"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

    // تهيئة كائن تشغيل الصوت للتنبيه الفوري الهادئ عند استقبال نداء جديد
    const kitchenAlertAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-128.wav');

    // الاستماع المباشر والحي لفرع نداءات النادل في قاعدة البيانات
    firebase.database().ref('waiter_calls').on('value', (snapshot) => {
        const calls = snapshot.val() || {};
        const container = document.getElementById('dom-waiter-calls-list');
        container.innerHTML = ''; // تنظيف القائمة قبل إعادة البناء الحية
        let hasCalls = false;
        let playNotificationSound = false; // متغير للتحقق مما إذا كان هناك نداء جديد غير ملبى

        for(const tableId in calls) {
            const call = calls[tableId];
            
            // التحقق من وجود نداء وأن حالته إما معلقة (pending) أو تم قبولها (accepted)
            if(call && (call.status === "pending" || call.status === "accepted")) {
                hasCalls = true;
                const card = document.createElement('div');
                card.className = "waiter-call-card";
                
                let callStatusText = `🔔 طاولة رقم [ ${tableId} ] تطلب حضور النادل فوراً`;
                let btnHtml = `<button class="btn btn-warning btn-sm fw-bold w-100" onclick="acceptWaiterCall('${tableId}')"><i class="bi bi-check-lg"></i> تلبية الطلب</button>`;
                
                // إذا كان النداء بحالة pending، نقوم بتفعيل إشارة تشغيل الصوت للتنبيه
                if(call.status === "pending") {
                    playNotificationSound = true;
                }
                
                // تحديث النصوص والأزرار إذا تم قبول الطلب وجاري إرسال الويتر بالطريق للزبون
                if(call.status === "accepted") {
                    callStatusText = `🏃‍♂️ طاولة [ ${tableId} ] (جاري التلبية وإرسال الويتر)`;
                    btnHtml = `<button class="btn btn-success btn-sm w-100" onclick="finishWaiterCall('${tableId}')"><i class="bi bi-check-circle"></i> إنهاء النداء وإغلاقه</button>`;
                }

                card.innerHTML = `
                    <div class="fw-bold text-white mb-2" style="font-size:0.95rem;">${callStatusText}</div>
                    ${btnHtml}
                `;
                container.appendChild(card);
            }
        }
        
        // تشغيل التنبيه الصوتي الهادئ في المطبخ في حال وجود نداء جديد نشط
        if(playNotificationSound) {
            kitchenAlertAudio.play().catch(e => console.log("المتصفح يتطلب تفاعل المستخدم أولاً لتشغيل الصوت تلقائياً"));
        }

        if(!hasCalls) {
            container.innerHTML = `<div class="text-muted text-center py-4 small">لا توجد استدعاءات خدمة معلقة.</div>`;
        }
    });

    // دالة قبول نداء النادل وتغيير حالته إلى accepted لإخطار الطاقم والزبون
    function acceptWaiterCall(tableId) {
        firebase.database().ref(`waiter_calls/${tableId}`).update({ status: "accepted" });
    }

    // دالة إنهاء وإغلاق النداء بالكامل ومسحه بعد ذهاب النادل للطاولة بنجاح
    function finishWaiterCall(tableId) {
        firebase.database().ref(`waiter_calls/${tableId}`).remove();
    }

    // الاستماع المباشر والحي لطلبات الطعام والفواتير الخاصة بالمطبخ وصالة الطعام
    firebase.database().ref('orders_system').on('value', (snapshot) => {
        const orders = snapshot.val() || {};
        const container = document.getElementById('dom-kitchen-orders-list');
        container.innerHTML = '';
        let hasOrders = false;

        for(const tableId in orders) {
            const order = orders[tableId];
            if(!order || order.status === "completed") continue; // تخطي الطلبات المكتملة والمغلقة مسبقاً
            hasOrders = true;

            // بناء واجهة العناصر والأطباق داخل الفاتورة مع عرض كمياتها برمجياً
            let itemsListHtml = Object.values(order.items).map(i => `
                <div class="d-flex justify-content-between border-bottom border-dark py-2 small text-light">
                    <span>🍲 ${i.name}</span>
                    <span class="badge bg-dark border border-secondary text-warning">الكمية: x${i.quantity}</span>
                </div>
            `).join('');

            // عرض حقل الملاحظات المخصصة للزبون إن وجدت وبشرط ألا تكون فارغة
            let notesSectionHtml = "";
            if(order.order_notes && order.order_notes !== "لا توجد ملاحظات مخصصة") {
                notesSectionHtml = `
                    <div class="notes-badge-box mb-3">
                        <i class="bi bi-exclamation-circle-fill me-1"></i> ملاحظة الزبون: ${order.order_notes}
                    </div>
                `;
            }

            // تحديد شكل وزر الإجراء البرمجي حسب حالة الطلب في المطبخ
            let actionButtonHtml = "";
            if(order.status === "pending") {
                actionButtonHtml = `<button class="btn btn-primary w-100 fw-bold py-2" onclick="updateOrderStatus('${tableId}', 'preparing')">قبول الفاتورة وبدء الطهي</button>`;
            } else if(order.status === "preparing") {
                actionButtonHtml = `<button class="btn btn-success w-100 fw-bold py-2 text-white" onclick="updateOrderStatus('${tableId}', 'on_the_way')">الوجبة جاهزة (إرسال للصالة)</button>`;
            } else if(order.status === "on_the_way") {
                actionButtonHtml = `<button class="btn btn-outline-danger w-100 fw-bold py-2" onclick="closeOrderTable('${tableId}')">تسوية الحساب وقفل الطاولة</button>`;
            }

            const cardWrapper = document.createElement('div');
            cardWrapper.className = "col-12 col-xl-6";
            cardWrapper.innerHTML = `
                <div class="kds-bill-card p-3 h-100 d-flex flex-column justify-content-between">
                    <div>
                        <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom border-secondary">
                            <h6 class="fw-bold text-warning mb-0"><i class="bi bi-hash"></i> طاولة رقم ${tableId}</h6>
                            <span class="badge bg-secondary">${order.status}</span>
                        </div>
                        <div class="mb-3">${itemsListHtml}</div>
                        ${notesSectionHtml}
                    </div>
                    <div>
                        <div class="d-flex justify-content-between fw-bold text-success mb-2 px-1">
                            <span>الإجمالي:</span>
                            <span>${Number(order.total_price).toLocaleString()} د.ع</span>
                        </div>
                        ${actionButtonHtml}
                    </div>
                </div>
            `;
            container.appendChild(cardWrapper);
        }
        if(!hasOrders) container.innerHTML = `<div class="text-muted text-center py-5">لا توجد طلبات جارية بالمطبخ حالياً.</div>`;
    });

    // دالة تحديث حالة الطلب الحالي (مثل: من انتظار إلى جاري التحضير)
    function updateOrderStatus(tableId, status) {
        firebase.database().ref(`orders_system/${tableId}`).update({ status: status });
    }

    // دالة إغلاق الطاولة المكتملة وتصفية الفاتورة مالياً
    function closeOrderTable(tableId) {
        if(confirm("هل تم استلام المبلغ المالي وإغلاق الطاولة؟")) {
            firebase.database().ref(`orders_system/${tableId}`).update({ status: "completed" });
        }
    }
</script>
</body>
</html>
