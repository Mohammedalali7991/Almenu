<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة مراقبة الطلبات العامة</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #111827; color: #f9fafb; padding-bottom: 40px; }
        .dashboard-header { background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%); border-bottom: 2px solid #374151; padding: 15px; }
        .dash-card { background-color: #1f2937; border: 1px solid #374151; border-radius: 14px; padding: 15px; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(0.99); } }
        .status-waiter-pulse { border: 2px solid #f59e0b !important; animation: pulse 1s infinite; }
        .status-bill-pulse { border: 2px solid #ef4444 !important; animation: pulse 1s infinite; }
        .dash-item-row { background: rgba(255,255,255,0.02); border-radius: 8px; padding: 6px 12px; margin-bottom: 6px; }
    </style>
</head>
<body>

<div class="dashboard-header text-center shadow">
    <h4 class="fw-bold mb-1 text-white">📊 لوحة المراقبة والمتابعة العامة</h4>
</div>

<div class="container-fluid px-3 mt-4">
    <div id="dashboard-grid" class="row g-3">
        <div class="col-12 text-center py-5 text-muted">جاري تحميل البيانات الحية...</div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    // إعدادات الاتصال بقاعدة بيانات Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyC6fFl4gN2N-W7oK3v70g_v3P932fM6bNY",
        authDomain: "almenu-system.firebaseapp.com",
        databaseURL: "https://almenu-system-default-rtdb.firebaseio.com",
        projectId: "almenu-system",
        storageBucket: "almenu-system.appspot.com",
        messagingSenderId: "305206060548",
        appId: "1:305206060548:web:b1d79aa3ec2c2cc2ebbb9d"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // كائنات تخزين مؤقتة محلياً لدمج البيانات الحية القادمة من المسارين المستقلين
    let localOrdersCache = {};
    let localWaiterCallsCache = {};

    // دالة بناء وعرض لوحة التحكم ديناميكياً بعد دمج البيانات
    function renderDashboard() {
        const container = document.getElementById('dashboard-grid');
        
        // تجميع كافة أرقام الطاولات الفريدة الموجودة في كلا الفرعين
        const allTableKeys = new Set([
            ...Object.keys(localOrdersCache),
            ...Object.keys(localWaiterCallsCache)
        ]);

        if (allTableKeys.size === 0) {
            container.innerHTML = `<div class="col-12 text-center py-5 text-white-50">✨ لا توجد طاولات نشطة حالياً.</div>`;
            return;
        }

        container.innerHTML = ''; // تنظيف الحاوية قبل الرسم الجديد

        allTableKeys.forEach(tableId => {
            const order = localOrdersCache[tableId];
            const waiterCall = localWaiterCallsCache[tableId];

            // تخطي الطاولات التي اكتملت طلباتها وليس لديها نداء نادل فعال
            const isOrderActive = order && order.status !== "completed";
            const isCallActive = waiterCall && (waiterCall.status === "pending" || waiterCall.status === "accepted");
            
            if (!isOrderActive && !isCallActive) return;

            let cardClass = "dash-card";
            let badge = `<span class="badge bg-success">⚙️ تحت الخدمة</span>`;

            // التحقق البرمجي من حالة نداء الويتر المنفصل لتطبيق تأثير الوميض
            if (waiterCall && waiterCall.status === "pending") {
                cardClass += " status-waiter-pulse";
                badge = `<span class="badge bg-warning text-dark">🔔 نداء ويتر معلق</span>`;
            } else if (waiterCall && waiterCall.status === "accepted") {
                badge = `<span class="badge bg-info text-dark">🏃‍♂️ جاري تلبية الويتر</span>`;
            } else if (order && order.bill_requested) {
                cardClass += " status-bill-pulse";
                badge = `<span class="badge bg-danger">🧾 طلب حساب</span>`;
            }

            // بناء قائمة الأطباق البرمجية في حال وجود طلب فعال على الطاولة
            let itemsHtml = "";
            let totalPrice = 0;
            if (isOrderActive) {
                totalPrice = order.total_price || 0;
                itemsHtml = Object.values(order.items || {}).map(i => `
                    <div class="d-flex justify-content-between dash-item-row">
                        <span class="text-white-50">${i.name}</span><span class="badge bg-primary">x${i.quantity}</span>
                    </div>
                `).join('');
            }

            const col = document.createElement('div');
            col.className = "col-12 col-md-6 col-lg-4";
            col.innerHTML = `
                <div class="${cardClass}">
                    <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2 border-secondary">
                        <h5 class="fw-bold mb-0 text-warning">طاولة # ${tableId}</h5>${badge}
                    </div>
                    <div class="mb-3">${itemsHtml || '<div class="text-muted small">نداء خدمة مستقل (بدون طلب طعام)</div>'}</div>
                    <div class="p-2 rounded bg-dark d-flex justify-content-between align-items-center">
                        <span class="small text-muted">الإجمالي:</span><span class="fw-bold text-success">${Number(totalPrice).toLocaleString()} د.ع</span>
                    </div>
                    <div class="row g-2 mt-2">
                        <div class="col-6">
                            <button class="btn btn-sm btn-outline-warning w-100" ${!isCallActive ? 'disabled' : ''} onclick="clearWaiterCall('${tableId}')">تلبية الويتر</button>
                        </div>
                        <div class="col-6">
                            <button class="btn btn-sm btn-outline-danger w-100" ${(!isOrderActive || !order.bill_requested) ? 'disabled' : ''} onclick="clearBillRequest('${tableId}')">تثبيط الحساب</button>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(col);
        });

        // إذا تم تصفية كافة الطاولات ولم يتبقَ أي كارد نشط للعرض
        if (container.children.length === 0) {
            container.innerHTML = `<div class="col-12 text-center py-5 text-white-50">✨ لا توجد طاولات نشطة حالياً.</div>`;
        }
    }

    // المستمع الأول: مراقبة فرع طلبات النظام
    database.ref('orders_system').on('value', (snapshot) => {
        localOrdersCache = snapshot.val() || {};
        renderDashboard();
    });

    // المستمع الثاني: مراقبة فرع نداءات النادل المستقل
    database.ref('waiter_calls').on('value', (snapshot) => {
        localWaiterCallsCache = snapshot.val() || {};
        renderDashboard();
    });

    // دالة معالجة زر تلبية الويتر (حذف النداء من فرعه المستقل في قاعدة البيانات)
    function clearWaiterCall(tableId) {
        database.ref(`waiter_calls/${tableId}`).remove();
    }

    // دالة معالجة زر تثبيط طلب الحساب الفاتورة داخل فرع الطلبات
    function clearBillRequest(tableId) {
        database.ref(`orders_system/${tableId}`).update({ bill_requested: false });
    }
</script>
</body>
</html>
